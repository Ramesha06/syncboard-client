services:
  mongodb:
    image: mongo:7.0
    container_name: syncboard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./syncboard-server
      dockerfile: Dockerfile
    container_name: syncboard-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - JWT_SECRET=syncboard_jwt_secret_dev_key_2026
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/syncboard}
    depends_on:
      - mongodb

  client:
    build:
      context: ./syncboard-client
      dockerfile: Dockerfile
    container_name: syncboard-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - server

volumes:
  mongo_data:
